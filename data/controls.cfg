{
	"controls": {
		"names": {
			"left": ~Left~,
			"right": ~Right~,
			"up": ~Up~,
			"down": ~Down~,
			"confirm": ~Confirm~,
			"menu": ~Menu~,
			"pause": ~Pause~,
			"cancel": ~Cancel~,
			"page-up": ~Page Up~,
			"page-down": ~Page Down~,
		},
		"layout": {
			"dialog_grid_size": [7, 5],
			"menu_positions": {
				"menu": [0,0],
				"pause": [2,0],
				"confirm": [0,2],
				"cancel": [1,2],
				"up": [4,1],
				"down": [4,2],
				"left": [3,2],
				"right": [5,2],
				"page-up": [4,0],
				"page-down": [5,0],
			},
		},
		"key_bindings": {
			# left/right/up/down and confirm/menu/pause/cancel should be defined at engine level as they are used for ui
			# defining specific keys for confirm/cancel will help with trying to screenshot dialogue, as it will
			# not go forward to new dialogue because I pressed Mod4+PrintScreen
			#
			# when re-binding we must also check that each 'action' has at least one input assigned to it
			"left": [ [{"type": "keyboard", "code": 1073741904, "strength": 1}] ],
			"right": [ [{"type": "keyboard", "code": 1073741903, "strength": 1}] ],
			"up": [ [{"type": "keyboard", "code": 1073741906, "strength": 1}] ], 
			"down": [ [{"type": "keyboard", "code": 1073741905, "strength": 1}] ], 
			"ui-left": [ [{"type": "keyboard", "code": 97, "strength": 1}] ],
			"ui-right": [ [{"type": "keyboard", "code": 100, "strength": 1}] ],
			"ui-up": [ [{"type": "keyboard", "code": 119, "strength": 1}] ],
			"ui-down": [ [{"type": "keyboard", "code": 115, "strength": 1}] ],
			"confirm": [ 
				[{"type": "keyboard", "code": 32, "strength": 1}],
				[{"type": "keyboard", "code": 13, "strength": 1}],
				[{"type": "keyboard", "code": 1073741912, "strength": 1}],
				[{"type": "keyboard", "code": 97, "strength": 1}],
			],
			"menu": [ [{"type": "keyboard", "code": 27, "strength": 1}] ],
			"pause": [
				[{"type": "keyboard", "code": 1073742048, "strength": 1}, {"type": "keyboard", "code": 112, "strength": 1}],
				[{"type": "keyboard", "code": 1073742052, "strength": 1}, {"type": "keyboard", "code": 112, "strength": 1}],
			],
			"cancel": [
				[{"type": "keyboard", "code": 27, "strength": 1}],
				[{"type": "keyboard", "code": 115, "strength": 1}],
			],
			"page-up": [
				[{"type": "keyboard", "code": 1073741899, "strength": 1}],
			],
			"page-down": [
				[{"type": "keyboard", "code": 1073741902, "strength": 1}],
			],
		},
		"button_bindings": {
			"left": [
				[{"type": "joy_button", "code": 13, "strength": 1}], #D-Pad left
			],
			"right": [
				[{"type": "joy_button", "code": 14, "strength": 1}], #D-pad right
			],
			"up": [
				[{"type": "joy_button", "code": 11, "strength": 1}], #D-pad up
			],
			"down": [
				[{"type": "joy_button", "code": 12, "strength": 1}], #D-pad down
			],
			"confirm": [
				[{"type": "joy_button", "code": 0, "strength": 1}], # Bottom of 4
			],
			"menu": [
				[{"type": "joy_button", "code": 1, "strength": 1}], # Left of the two center ones 'Start'
			],
			"cancel": [
				[{"type": "joy_button", "code": 4, "strength": 1}] # Right of 4
			],
		},
		"axes_bindings": {
			SDL_CONTROLLER_AXIS_LEFTX: ["left","right"],
			SDL_CONTROLLER_AXIS_LEFTY: ["up", "down"],
			SDL_CONTROLLER_AXIS_RIGHTX: ["look_left","look_right"],
			SDL_CONTROLLER_AXIS_RIGHTY: ["look_up","look_down"]
		}
	}
